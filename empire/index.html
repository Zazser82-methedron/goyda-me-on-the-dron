<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ГОЙДА-ИМПЕРИЯ — 3D-стратегия</title>
<script>
/* ранний перехват ошибок — срабатывает ДО модулей, ловит и ошибки линковки/загрузки */
(function () {
  function box(msg) {
    var b = document.getElementById('errbox');
    if (!b) { b = document.createElement('div'); b.id = 'errbox'; b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:rgba(120,0,0,.97);color:#fff;font:13px/1.5 monospace;padding:10px 14px;white-space:pre-wrap;max-height:45vh;overflow:auto'; (document.body || document.documentElement).appendChild(b); }
    b.style.display = 'block'; b.textContent = '⚠ ' + msg;
  }
  window.addEventListener('error', function (e) { box((e.message || e.type) + '  @ ' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '')); });
  window.addEventListener('unhandledrejection', function (e) { box('promise: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason)); });
  window.__gboot = function (s) { var d = document.getElementById('bootlog'); if (!d) { d = document.createElement('div'); d.id = 'bootlog'; d.style.cssText = 'position:fixed;left:8px;top:54px;z-index:99998;color:#9fef9f;font:11px monospace;opacity:.65'; (document.body || document.documentElement).appendChild(d); } d.textContent = 'boot: ' + s; };
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ysabeau+SC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/theme.css?v=40">
<link rel="stylesheet" href="./css/hud.css?v=40">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="hud">
    <!-- верхняя панель -->
    <div id="topbar">
      <div id="res"></div>
      <div id="rankbox"></div>
      <div id="status"></div>
      <div id="wavebox"></div>
      <div class="spacer"></div>
      <button id="superBtn" class="topbtn">СВЕРХ-ГОЙДА</button>
      <button id="techBtn" class="topbtn icon" title="Древо технологий (исследования)">🔬</button>
      <button id="fxBtn" class="topbtn icon on" title="Графика: пост-обработка вкл/выкл (если тормозит — выключи)">✨</button>
      <button id="lobbyBtn" class="topbtn icon" title="Выйти в меню ГОЙДЫ">🏠</button>
      <button id="restartBtn" class="topbtn icon" title="Начать игру заново">↻</button>
      <button id="muteBtn" class="topbtn icon">🔊</button>
    </div>

    <!-- тосты -->
    <div id="toasts"></div>

    <!-- миникарта -->
    <div id="mini-wrap"><canvas id="minimap" width="170" height="170"></canvas></div>

    <!-- панель выбора -->
    <div id="selection"></div>

    <!-- древо технологий (исследования) -->
    <div id="research"></div>

    <!-- нижняя панель построек + указы -->
    <div id="bottombar">
      <div id="buildbtns"></div>
      <div id="edicts"></div>
    </div>

    <div id="hint"><b>W A S D</b> — двигать &nbsp;·&nbsp; <b>ЛКМ</b> — выбрать &nbsp;·&nbsp; <b>ПКМ</b> — приказ (идти/рубить/в атаку) &nbsp;·&nbsp; <b>СКМ-таскать</b> — поворот &nbsp;·&nbsp; колесо — зум &nbsp;·&nbsp; <b>R</b> — повернуть постройку &nbsp;·&nbsp; ПРОБЕЛ — СВЕРХ-ГОЙДА &nbsp;·&nbsp; ESC — отмена</div>
  </div>

  <!-- слой всплывающего текста -->
  <div id="floaters"></div>

  <!-- стартовый экран (выбор фракции/земли) -->
  <div id="start"></div>

  <!-- победа/поражение -->
  <div id="overlay"></div>
</div>

<script type="module" src="./js/main.js?v=40"></script>
</body>
</html>
